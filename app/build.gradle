plugins { id 'com.android.application' }

// Signing: the key is NOT in the repository. CI restores it from the CYBNATE_KEYSTORE_BASE64
// secret into the path below and passes the passwords as environment variables.
// Without them the release build falls back to debug signing, which cannot update an installed app.
def ksPath = System.getenv('CYBNATE_KEYSTORE_PATH') ?: 'keystore/cybnate.jks'
def ksFile = rootProject.file(ksPath)
def ksPass = System.getenv('CYBNATE_STORE_PASSWORD')
def keyAliasName = System.getenv('CYBNATE_KEY_ALIAS') ?: 'cybnate'
def keyPass = System.getenv('CYBNATE_KEY_PASSWORD') ?: ksPass
def canSign = ksFile.exists() && ksPass

android {
    namespace 'com.cybnate.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cybnate.app'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile ksFile
                storePassword ksPass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig canSign ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // TODO(handoff): these two flags switch the lint gate off. Enable them (abortOnError true,
    // checkReleaseBuilds true) only after one full `gradle :app:lintRelease` run is clean, because
    // turning them on with existing lint errors will break the release build.
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
